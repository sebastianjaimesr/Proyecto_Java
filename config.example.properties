# ==============================================================
# ERP Little Horizons - plantilla de configuración
# Copie este archivo como "config.properties" en la carpeta raíz
# del proyecto y reemplace los valores ficticios.
# config.properties está excluido de Git: nunca lo suba al repositorio.
# ==============================================================

# --- Base de datos MySQL 8.0+ ---
db.host=localhost
db.port=3306
db.name=erp_little_horizons
db.user=usuario_de_ejemplo
db.password=clave_de_ejemplo
# Parámetros adicionales de la URL JDBC (sin el signo "?")
db.params=serverTimezone=America/Bogota&characterEncoding=UTF-8&connectTimeout=5000

# --- Registros de errores ---
# Carpeta donde se crea error_log.txt (relativa a la carpeta del proyecto)
logs.dir=logs

# --- Consola ---
# AUTO: usa la codificación de la terminal si existe y UTF-8 en el IDE.
# También se puede indicar una codificación concreta, por ejemplo UTF-8 o IBM850.
console.encoding=AUTO
